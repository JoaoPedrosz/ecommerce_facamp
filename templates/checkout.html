<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Finalizar pedido - Loja FACAMP
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <header>

        <h1>
            Loja FACAMP
        </h1>

        <a href="{{ url_for('carrinho') }}">
            Voltar ao carrinho
        </a>

    </header>

    <main>

        <h2>
            Finalizar pedido
        </h2>

        {% if erro %}

        <div class="mensagem-erro">
            {{ erro }}
        </div>

        {% endif %}


        {% if cliente_logado %}

        <!-- =========================
             CLIENTE LOGADO
             ========================= -->

        <div class="form-checkout">

            <h3>
                Olá, {{ cliente_logado.nome }}!
            </h3>

            <p>
                Você está comprando como:
            </p>

            <p>
                <strong>
                    {{ cliente_logado.email }}
                </strong>
            </p>

            <form method="post">

                <button type="submit">
                    Confirmar pedido
                </button>

            </form>

        </div>


        {% else %}

        <!-- =========================
             CLIENTE NÃO LOGADO
             ========================= -->

        <form
            method="post"
            class="form-checkout"
        >

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                maxlength="120"
                required
            >

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                maxlength="160"
                required
            >

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                name="senha"
                minlength="6"
                required
            >

            <button type="submit">
                Confirmar pedido
            </button>

        </form>

        <p class="ja-cadastrado">

            Já possui cadastro?

            <a
                href="{{ url_for('login', proximo='checkout') }}"
            >
                Entrar
            </a>

        </p>

        {% endif %}

    </main>

</body>

</html>
