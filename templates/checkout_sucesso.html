<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedido realizado - Loja FACAMP</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>Loja FACAMP</h1>

        <a href="{{ url_for('catalogo') }}">
            Voltar ao catálogo
        </a>
    </header>

    <main>

        <div class="checkout-sucesso">

            <h2>Pedido realizado com sucesso!</h2>

            <p>
                Número do pedido:
                <strong>#{{ pedido.id }}</strong>
            </p>

            <p>
                Status:
                <strong>{{ pedido.status }}</strong>
            </p>

            <p>
                Total:
                <strong>
                    R$ {{ '%.2f'|format(pedido.total) }}
                </strong>
            </p>

            <a class="botao-checkout" href="{{ url_for('meus_pedidos') }}">
                Ver meus pedidos
            </a>

        </div>

    </main>

</body>

</html>
